name: Daily run
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install .

      - name: Restore photo metadata cache
        uses: actions/cache@v6
        with:
          path: ~/.config/flickr-promoter/metadata-cache.json
          key: flickr-promoter-metadata-cache-v1
          restore-keys: |
            flickr-promoter-metadata-cache-

      - name: Run
        env:
          FLICKR_PROMOTER_API_KEY: ${{ secrets.FLICKR_PROMOTER_API_KEY }}
          FLICKR_PROMOTER_API_SECRET: ${{ secrets.FLICKR_PROMOTER_API_SECRET }}
          FLICKR_PROMOTER_OAUTH_TOKEN: ${{ secrets.FLICKR_PROMOTER_OAUTH_TOKEN }}
          FLICKR_PROMOTER_OAUTH_TOKEN_SECRET: ${{ secrets.FLICKR_PROMOTER_OAUTH_TOKEN_SECRET }}
          FLICKR_PROMOTER_METADATA_CACHE_FILE: ~/.config/flickr-promoter/metadata-cache.json
        run: flickr-promoter
